<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart OCR with Advanced Text Control</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .highlight { background-color: #f4f4f4; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
    .line { margin-bottom: 5px; }
    .controls { margin-top: 20px; }
    textarea { width: 100%; height: 100px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Smarter OCR Tool with Selective Text Extraction</h1>
  <input type="file" id="imageInput" accept="image/*" />
  <button onclick="uploadImage()">Upload & Process</button>

  <div id="textBlocks" class="highlight"></div>
  <div class="controls">
    <button onclick="copySelectedText()">Copy Selected Text</button>
    <textarea id="output" placeholder="Selected text will appear here..."></textarea>
  </div>

  <script>
    async function uploadImage() {
      const fileInput = document.getElementById('imageInput');
      const file = fileInput.files[0];
      if (!file) return alert('Please select an image.');

      const formData = new FormData();
      formData.append('image', file);

      const response = await fetch('http://127.0.0.1:5000/ocr', {
        method: 'POST',
        body: formData
      });

      const data = await response.json();
      const container = document.getElementById('textBlocks');
      container.innerHTML = '';

      data.lines.forEach((line, index) => {
        const div = document.createElement('div');
        div.className = 'line';
        div.innerHTML = `
          <input type="checkbox" id="line${index}" value="${line}">
          <label for="line${index}">${line}</label>
        `;
        container.appendChild(div);
      });
    }

    function copySelectedText() {
      const checkboxes = document.querySelectorAll('input[type=checkbox]:checked');
      const output = Array.from(checkboxes).map(cb => cb.value).join('\n');
      document.getElementById('output').value = output;
      navigator.clipboard.writeText(output).then(() => alert('Selected text copied!'));
    }
  </script>
</body>
</html>
